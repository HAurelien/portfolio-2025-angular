<section>
    <ul>
      <li *ngFor="let data of datas" class="list-item" (click)="onDataCLicked(data)">
            <div class="item-content">
                <div class="item-upper-block">
                    <img [src]="data.icon" alt="icon">
                    <h2 class="title">{{data.title}}</h2>
                </div>
                <div class="description">
                    <span class="effect-opening">&#60;h3&#62;</span>
                    <h3>{{data.description}}</h3>
                    <span class="effect-closing">&#60;/h3&#62;</span>
                </div>
            </div>
        </li>
    </ul>
</section>
