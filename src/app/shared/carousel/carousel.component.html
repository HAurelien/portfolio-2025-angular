<section>
    <main class="carousel-container">
        <div class="carousel">
            <div class="item" *ngFor="let item of items; let i = index" [class.active]="i === currentIndex">
                <div class="carousel-image-container">
                    <img [src]="item.image" [alt]="item.title" />
                </div>
                <a class="title" [href]="item.link">{{ item.title }}</a>
            </div>
        </div>
        <button class="btn prev" (click)="navigate('prev')">Prev</button>
        <button class="btn next" (click)="navigate('next')">Next</button>
        <div class="dots">
            <span *ngFor="let dot of dots; let i = index" 
                  (click)="selectItem(i)" 
                  [class.active]="i === currentIndex" 
                  class="dot"></span>
        </div>
    </main>
</section>
